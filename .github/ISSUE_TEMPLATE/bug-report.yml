name: Bug report
description: Report a reproducible problem using synthetic data only.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve Prumo.

        **Do not attach real spreadsheets, databases, backups, exports, balances, categories, notes, screenshots, paths, or logs.** Reduce the problem to synthetic data before reporting it. Report security issues privately using `SECURITY.md`.

  - type: dropdown
    id: edition
    attributes:
      label: Prumo edition
      options:
        - Prumo Web
        - Prumo Local
        - Documentation or tooling
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Use a release number or commit identifier. Do not include a personal path.
      placeholder: v0.1.0 or commit identifier
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser and operating-system versions, or Node.js version for Local.
      placeholder: Firefox on macOS, or Node.js 22 on macOS
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem without including real financial or identifying data.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Give the smallest sequence of steps and use clearly fictional names and values.
      placeholder: |
        1. Open the fictional demo
        2. Choose …
        3. Observe …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I reviewed this report and its attachments contain only synthetic data and no personal paths, names, notifications, browser history, or secrets.
          required: true
        - label: This is not a security vulnerability or suspected financial-data upload. I will use the private process in `SECURITY.md` for those reports.
          required: true

  - type: textarea
    id: context
    attributes:
      label: Additional safe context
      description: Optional. Paste only sanitised output or a minimal synthetic fixture.
    validations:
      required: false
